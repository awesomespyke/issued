{% extends "base.html" %}
{% block title %}Tags - {{ title }}{% endblock %}
{% block content %}
<div class="tags-index fade-in">
  <h1
    class="mb-6 bg-gradient-to-r from-violet-600 via-purple-600 to-pink-600 bg-clip-text text-2xl font-bold text-transparent sm:text-3xl">
    Tags</h1>

  {% if tag_rows %}
  <ul class="flex flex-wrap gap-3" id="tags-list">
    {% for row in tag_rows %}
    <li id="tag-item-{{ row.name | urlencode }}" class="group flex items-center gap-0">
      <a href="{{ url_path(request, 'browse_tag', tag_name=row.name) }}"
        class="inline-flex items-center gap-2 rounded-l-full border border-r-0 border-violet-200 bg-white pl-4 pr-3 py-2 text-sm font-medium text-violet-700 shadow-sm transition hover:bg-violet-50">
        <i data-lucide="tag" class="h-3.5 w-3.5 shrink-0 text-violet-400"></i>
        {{ row.name }}
        <span class="rounded-full bg-violet-100 px-2 py-0.5 text-xs font-semibold text-violet-600">{{ row.comic_count
          }}</span>
      </a>
    </li>
    {% endfor %}
  </ul>
  {% endif %}
</div>
{% endblock %}
{% block scripts %}

{% endblock %}
