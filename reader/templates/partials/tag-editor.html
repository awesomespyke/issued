<script>
  (function () {
    function renderTagChips(tags, container) {
      if (!container) return;

      container.innerHTML = '';

      (tags || []).forEach(function (tag) {
        const chip = document.createElement('a');
        chip.href = '/reader/tags/' + encodeURIComponent(tag);
        chip.className = 'inline-flex items-center rounded-full bg-violet-100 px-3 py-1 text-xs font-semibold text-violet-700 transition hover:bg-violet-200';
        chip.textContent = tag;
        container.appendChild(chip);
      });
    }

    // Keep the existing browser.js hook; tags are now display-only.
    window._tagsLoadForComic = function (uuid, tags) {
      renderTagChips(
        tags || [],
        document.getElementById('comic-info-tags-chips')
      );
    };
  }());
</script>
